<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCDCE2"/></linearGradient>
 <linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A4A4E"/><stop offset="1" stop-color="#1C1C1E"/></linearGradient>
 <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5C5C61"/><stop offset="1" stop-color="#2C2C2E"/></linearGradient>
 <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#64D2FF"/><stop offset="1" stop-color="#0A84FF"/></linearGradient>
 <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
 <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<!-- haptic pulse rings -->
<rect x="150" y="150" width="724" height="724" rx="200" fill="none" stroke="url(#ring)" stroke-width="14" opacity="0.28"/>
<rect x="208" y="208" width="608" height="608" rx="160" fill="none" stroke="url(#ring)" stroke-width="18" opacity="0.55"/>
<!-- shadow -->
<rect x="300" y="360" width="424" height="400" rx="100" fill="#000" opacity="0.35" filter="url(#sh)"/>
<!-- keycap skirt -->
<rect x="282" y="282" width="460" height="460" rx="104" fill="url(#skirt)"/>
<!-- keycap top face -->
<rect x="318" y="298" width="388" height="376" rx="80" fill="url(#top)"/>
<rect x="318" y="298" width="388" height="376" rx="80" fill="url(#hl)"/>
<!-- return arrow -->
<path d="M588 396 V516 H442 M486 472 L442 516 L486 560" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>