<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCDCE2"/></linearGradient>
 <linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A4A4E"/><stop offset="1" stop-color="#1C1C1E"/></linearGradient>
 <linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5C5C61"/><stop offset="1" stop-color="#2C2C2E"/></linearGradient>
 <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#636366"/><stop offset="1" stop-color="#3A3A3C"/></linearGradient>
 <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
 <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<!-- haptic pulse rings -->
<rect x="104" y="104" width="816" height="816" rx="230" fill="none" stroke="url(#ring)" stroke-width="14" opacity="0.28"/>
<rect x="160" y="160" width="704" height="704" rx="190" fill="none" stroke="url(#ring)" stroke-width="18" opacity="0.55"/>
<!-- shadow -->
<rect x="250" y="320" width="524" height="490" rx="120" fill="#000" opacity="0.35" filter="url(#sh)"/>
<!-- keycap skirt -->
<rect x="232" y="232" width="560" height="560" rx="126" fill="url(#skirt)"/>
<!-- keycap top face -->
<rect x="276" y="251" width="472" height="458" rx="97" fill="url(#top)"/>
<rect x="276" y="251" width="472" height="458" rx="97" fill="url(#hl)"/>
<!-- return arrow -->
<path transform="translate(512 480) scale(1.22) translate(-515 -478)" d="M588 396 V516 H442 M486 472 L442 516 L486 560" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
