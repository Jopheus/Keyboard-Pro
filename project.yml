# XcodeGen project file — the build server turns this into an Xcode project.
name: KeyboardPro
options:
  bundleIdPrefix: com.example.keyboardpro
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  KeyboardPro:
    type: application
    platform: iOS
    sources:
      - App
      # The app shows the same settings as the keyboard, so it shares the
      # settings model, the Tac Tile engine and the key sounds (for previews).
      - Keyboard/Settings.swift
      - Keyboard/Feedback.swift
      - path: Keyboard/Sounds
        buildPhase: resources
    scheme: {}
    entitlements:
      path: Supporting/App.entitlements
      properties:
        # Shared store so settings changed in the app reach the keyboard.
        com.apple.security.application-groups: [group.com.example.keyboardpro]
    info:
      path: Supporting/App-Info.plist
      properties:
        CFBundleDisplayName: Keyboard Pro
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # keyboardpro://settings — the keyboard's gear opens the app with this link.
        CFBundleURLTypes:
          - CFBundleURLName: com.example.keyboardpro
            CFBundleURLSchemes: [keyboardpro]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.keyboardpro
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: Keyboard
        embed: true
  Keyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard]
    entitlements:
      path: Supporting/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.keyboardpro]
    info:
      path: Supporting/Keyboard-Info.plist
      properties:
        CFBundleDisplayName: Keyboard Pro
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.keyboardpro.keyboard
