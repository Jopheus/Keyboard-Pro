# XcodeGen project file — the build server turns this into an Xcode project.
name: KeyboardPro
options:
  bundleIdPrefix: com.example.keyboardpro
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  KeyboardPro:
    type: application
    platform: iOS
    # The app shows the full settings, so it also compiles the keyboard's code
    # (settings screen, sounds, key styles) and bundles the sound files.
    sources: [App, Keyboard]
    scheme: {}
    entitlements:
      path: Supporting/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.keyboardpro]
    info:
      path: Supporting/App-Info.plist
      properties:
        CFBundleDisplayName: Keyboard Pro
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # keyboardpro://settings opens the app (the keyboard's gear button)
        CFBundleURLTypes:
          - CFBundleURLName: com.example.keyboardpro
            CFBundleURLSchemes: [keyboardpro]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.keyboardpro
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: Keyboard
        embed: true
  Keyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard]
    entitlements:
      path: Supporting/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.keyboardpro]
    info:
      path: Supporting/Keyboard-Info.plist
      properties:
        CFBundleDisplayName: Keyboard Pro
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.keyboardpro.keyboard
