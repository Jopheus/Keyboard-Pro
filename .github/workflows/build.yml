name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use newest Xcode 26 (needed for Liquid Glass)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: mkdir -p Supporting && xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild archive \
            -project KeyboardPro.xcodeproj \
            -scheme KeyboardPro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KeyboardPro.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/KeyboardPro.xcarchive/Products/Applications/KeyboardPro.app Payload/
          # Ad-hoc sign with the App Group entitlement (keyboard first, then the
          # app) so the settings shared between app and keyboard survive
          # re-signing by Sideloadly.
          codesign --force --sign - --entitlements Supporting/Keyboard.entitlements \
            Payload/KeyboardPro.app/PlugIns/Keyboard.appex
          codesign --force --sign - --entitlements Supporting/App.entitlements \
            Payload/KeyboardPro.app
          codesign -d --entitlements - Payload/KeyboardPro.app/PlugIns/Keyboard.appex
          zip -qr KeyboardPro.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: KeyboardPro-ipa
          path: KeyboardPro.ipa
