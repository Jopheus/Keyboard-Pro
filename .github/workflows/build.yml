name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use newest Xcode 26 (needed for Liquid Glass)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: mkdir -p Supporting && xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild archive \
            -project KeyboardPro.xcodeproj \
            -scheme KeyboardPro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KeyboardPro.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      # The unsigned build carries no entitlements. Ad-hoc sign the keyboard,
      # then the app, with their App Group entitlement so the sideloading tool
      # that re-signs the IPA sets up the shared settings store.
      - name: Add App Group entitlements (ad-hoc sign)
        run: |
          APP=build/KeyboardPro.xcarchive/Products/Applications/KeyboardPro.app
          for EXT in "$APP"/PlugIns/*.appex; do
            codesign -f -s - --entitlements Supporting/Keyboard.entitlements "$EXT"
          done
          codesign -f -s - --entitlements Supporting/App.entitlements "$APP"
          codesign -d --entitlements - "$APP"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/KeyboardPro.xcarchive/Products/Applications/KeyboardPro.app Payload/
          zip -qr KeyboardPro.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: KeyboardPro-ipa
          path: KeyboardPro.ipa
