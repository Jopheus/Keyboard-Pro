name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: mkdir -p Supporting && xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild archive \
            -project KeyboardPro.xcodeproj \
            -scheme KeyboardPro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/KeyboardPro.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/KeyboardPro.xcarchive/Products/Applications/KeyboardPro.app Payload/
          zip -qr KeyboardPro.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: KeyboardPro-ipa
          path: KeyboardPro.ipa
